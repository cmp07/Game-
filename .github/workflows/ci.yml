# Echo Lattice — validate + export
# Authority: docs/RELEASE/CI_BUILDS.md, docs/RELEASE/BUILD_WINDOWS.md
#
# validate  — always required (Python gates; no Godot needed)
# export-*  — Godot via digest-pinned container; Windows jobs stamp checksums

name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  PROJECT_PATH: game/echo_lattice
  # Pin from tools/release/godot_toolchain.json (amd64 digest for tag 4.3).
  GODOT_CI_IMAGE: barichello/godot-ci:4.3@sha256:8d3a9fc683fcaa5b7d8b1c90fa94318402ebb00edeb5f6e2df4bac46665b98ff

jobs:
  validate:
    name: Validate (Python + chambers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chamber JSON validation
        run: python3 game/echo_lattice/tests/validate_chambers.py

      - name: Steamworks catalog / flags gate
        run: python3 game/echo_lattice/tests/test_steamworks.py

      - name: Demo spec gate
        run: python3 game/echo_lattice/tests/test_demo_spec.py

      - name: Windows export contract gate
        run: python3 game/echo_lattice/tests/test_windows_export.py

      - name: Deck bindings gate
        run: python3 game/echo_lattice/tests/check_deck_bindings.py

      - name: Locale gate
        run: python3 game/echo_lattice/tests/validate_locale.py

      - name: Accessibility settings gate
        run: python3 game/echo_lattice/tests/test_a11y_settings.py

  # ---------------------------------------------------------------------------
  # Godot export (container). Templates ship under /root in the image;
  # move them into the Actions user home before export (abarichello/godot-ci).
  # Windows (+ Demo) jobs write BUILD_STAMP.json / SHA256SUMS.txt / ARTIFACTS.md
# via tools/release/stamp_export_artifacts.sh (POSIX; no python3 in godot-ci).
  # Publish to Steam/itch remains manual (see steam/ + CI_BUILDS.md secrets).
  # ---------------------------------------------------------------------------
  export-linux:
    name: Export Linux (Godot container)
    needs: validate
    runs-on: ubuntu-latest
    # Soft gate until digest-pinned image is trusted as merge-blocking.
    continue-on-error: true
    container:
      image: barichello/godot-ci:4.3@sha256:8d3a9fc683fcaa5b7d8b1c90fa94318402ebb00edeb5f6e2df4bac46665b98ff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export Linux/X11 release
        working-directory: ${{ env.PROJECT_PATH }}
        # Container default shell is sh (not bash) — keep POSIX.
        run: |
          set -eu
          mkdir -p builds/linux
          godot --headless --path . --export-release "Linux/X11" builds/linux/EchoLattice.x86_64
          test -f builds/linux/EchoLattice.x86_64
          chmod +x builds/linux/EchoLattice.x86_64

      - name: Stamp Linux artifact
        run: |
          set -eu
          # godot-ci image has no python3 — use POSIX stamp helper.
          sh tools/release/stamp_export_artifacts.sh \
            --out-dir game/echo_lattice/builds/linux \
            --preset "Linux/X11" \
            --artifact-name echo-lattice-linux-x86_64 \
            --exe-name EchoLattice.x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-lattice-linux-x86_64
          path: game/echo_lattice/builds/linux/
          if-no-files-found: warn

  export-windows:
    name: Export Windows (Godot container)
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3@sha256:8d3a9fc683fcaa5b7d8b1c90fa94318402ebb00edeb5f6e2df4bac46665b98ff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export Windows Desktop release
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -eu
          mkdir -p builds/windows
          godot --headless --path . --export-release "Windows Desktop" builds/windows/EchoLattice.exe
          test -f builds/windows/EchoLattice.exe
          # Godot usually emits a sibling .pck when embed_pck=false
          if [ ! -f builds/windows/EchoLattice.pck ]; then
            echo "warn: EchoLattice.pck missing (embed_pck may have changed)" >&2
          fi

      - name: Version stamp + checksums
        run: |
          set -eu
          # godot-ci image has no python3 — use POSIX stamp helper.
          sh tools/release/stamp_export_artifacts.sh \
            --out-dir game/echo_lattice/builds/windows \
            --preset "Windows Desktop" \
            --artifact-name echo-lattice-windows-x86_64 \
            --exe-name EchoLattice.exe
          test -f game/echo_lattice/builds/windows/BUILD_STAMP.json
          test -f game/echo_lattice/builds/windows/SHA256SUMS.txt
          test -f game/echo_lattice/builds/windows/ARTIFACTS.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd game/echo_lattice/builds/windows && sha256sum -c SHA256SUMS.txt)
          fi
          cat game/echo_lattice/builds/windows/ARTIFACTS.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-lattice-windows-x86_64
          path: game/echo_lattice/builds/windows/
          if-no-files-found: warn

  export-windows-demo:
    name: Export Windows Demo (Godot container)
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3@sha256:8d3a9fc683fcaa5b7d8b1c90fa94318402ebb00edeb5f6e2df4bac46665b98ff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Export Windows Demo
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          set -eu
          mkdir -p builds/windows_demo
          godot --headless --path . --export-release "Windows Demo" builds/windows_demo/EchoLatticeDemo.exe
          test -f builds/windows_demo/EchoLatticeDemo.exe

      - name: Version stamp + checksums
        run: |
          set -eu
          # godot-ci image has no python3 — use POSIX stamp helper.
          sh tools/release/stamp_export_artifacts.sh \
            --out-dir game/echo_lattice/builds/windows_demo \
            --preset "Windows Demo" \
            --artifact-name echo-lattice-windows-demo-x86_64 \
            --exe-name EchoLatticeDemo.exe \
            --custom-features demo
          test -f game/echo_lattice/builds/windows_demo/BUILD_STAMP.json
          test -f game/echo_lattice/builds/windows_demo/SHA256SUMS.txt
          test -f game/echo_lattice/builds/windows_demo/ARTIFACTS.md
          if command -v sha256sum >/dev/null 2>&1; then
            (cd game/echo_lattice/builds/windows_demo && sha256sum -c SHA256SUMS.txt)
          fi
          cat game/echo_lattice/builds/windows_demo/ARTIFACTS.md

      - name: Upload Windows Demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: echo-lattice-windows-demo-x86_64
          path: game/echo_lattice/builds/windows_demo/
          if-no-files-found: warn
