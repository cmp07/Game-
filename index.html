<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake — Game-</title>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Snake</h1>
        <div class="scoreboard">
          <div class="scoreboard__item">
            <span class="scoreboard__label">Score</span>
            <span class="scoreboard__value" id="score">0</span>
          </div>
          <div class="scoreboard__item">
            <span class="scoreboard__label">Best</span>
            <span class="scoreboard__value" id="best">0</span>
          </div>
        </div>
      </header>

      <div class="board">
        <canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay">
          <p class="overlay__title" id="overlay-title">Ready?</p>
          <p class="overlay__hint" id="overlay-hint">Press Space or tap Start to play</p>
          <button class="overlay__button" id="start" type="button">Start</button>
        </div>
      </div>

      <footer class="app__footer">
        <p>Use the <strong>arrow keys</strong> or <strong>WASD</strong> to steer. Press <strong>Space</strong> to pause.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
